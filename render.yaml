# Dedicated public simulation: never point this blueprint at a real portfolio database.
# Web, worker and database plans create billable resources. Review plans before deploying.
services:
  - type: web
    name: investnexus-demo
    runtime: node
    plan: starter
    region: oregon
    rootDir: v2
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: investnexus-demo-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_MAX_ACCOUNTS
        value: "1000"
      - key: MARKET_PROVIDER
        value: mock
  - type: worker
    name: investnexus-demo-reports
    runtime: node
    plan: starter
    region: oregon
    rootDir: v2
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: investnexus-demo-db
          property: connectionString
      - key: MARKET_PROVIDER
        value: mock
  - type: worker
    name: investnexus-demo-market
    runtime: node
    plan: starter
    region: oregon
    rootDir: v2
    buildCommand: npm ci && npm run build
    startCommand: npm run market:worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: investnexus-demo-db
          property: connectionString
      - key: MARKET_PROVIDER
        value: mock
      - key: MARKET_POLL_SECONDS
        value: "3600"
databases:
  - name: investnexus-demo-db
    plan: basic-256mb
    region: oregon
    databaseName: investnexus
    user: investnexus
    ipAllowList: []
