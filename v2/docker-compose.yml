services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investnexus
      POSTGRES_PASSWORD: investnexus_local
      POSTGRES_DB: investnexus
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investnexus -d investnexus"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["messaging"]
    environment:
      RABBITMQ_DEFAULT_USER: investnexus
      RABBITMQ_DEFAULT_PASS: investnexus_local
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "127.0.0.1:56379:6379"
volumes:
  rabbitmq_data:
  postgres_data:
